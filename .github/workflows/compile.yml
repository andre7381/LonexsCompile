name: Build gamemode

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GAMEMODE: icerussia

jobs:
  build:
    # Мод написан под pawncc 3.2.3664 (SA-MP), поэтому собираем им же на Windows.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Стандартные инклуды (a_samp и т.д.), если их нет в репозитории
      - name: Download SA-MP stdlib
        run: git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib

      - name: Compile
        run: |
          mkdir -p build
          # tools/pawncc/ = pawncc.exe + pawnc.dll из твоего Pawno (3.2.3664)
          ./tools/pawncc/pawncc.exe "gamemodes/${GAMEMODE}.pwn" \
            -ogamemodes/${GAMEMODE}.amx \
            -i"include" \
            -i"tools/pawncc/include" \
            -i"samp-stdlib" \
            -d3 '-;+' '-(+' \
            2>&1 | tee build/compile.log
          test -f "gamemodes/${GAMEMODE}.amx"

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAMEMODE }}-amx
          path: gamemodes/${{ env.GAMEMODE }}.amx

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: build/compile.log
