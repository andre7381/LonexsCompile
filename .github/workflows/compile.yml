name: Build lonexs

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386

      - name: Download pawncc 3.10.10
        run: |
          curl -fL -o pawncc.tar.gz \
            https://github.com/pawn-lang/compiler/releases/download/v3.10.10/pawnc-3.10.10-linux.tar.gz
          mkdir pawncc
          tar -xzf pawncc.tar.gz -C pawncc --strip-components=1

      - name: Insert DB credentials from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          p = 'gamemodes/lonexs.pwn'
          s = open(p, encoding='latin-1', newline='').read()
          host = os.environ.get('DB_HOST') or '127.0.0.1'
          user = os.environ.get('DB_USER', '')
          db = os.environ.get('DB_NAME', '')
          pw = os.environ.get('DB_PASSWORD', '')
          if not (user and db and pw):
              sys.exit('Нужны секреты DB_USER, DB_NAME, DB_PASSWORD')
          def esc(x):
              return x.replace('\\', '\\\\').replace('"', '\\"')
          q = lambda x: '"' + esc(x) + '"'
          total = 0
          for name, val in (('LAIRD_HOST', host), ('LAIRD_USER', user),
                            ('LAIRD_DB', db), ('LAIRD_PASSWORD', pw)):
              pat = r'(#define\s+' + name + r'\s+)"[^"]*"'
              s, n = re.subn(pat, lambda m: m.group(1) + q(val), s)
              print(name, 'replaced:', n)
              total += n
          pat = r'mysql_connect\(\s*"[^"]*"\s*,\s*"[^"]*"\s*,\s*"[^"]*"\s*,\s*"[^"]*"\s*\)'
          rep = 'mysql_connect(' + ', '.join(q(v) for v in (host, user, db, pw)) + ')'
          s, n = re.subn(pat, lambda m: rep, s)
          print('mysql_connect replaced:', n)
          total += n
          if total == 0:
              sys.exit('Ничего не заменено')
          open(p, 'w', encoding='latin-1', newline='').write(s)
          PY

      - name: Compile
        run: |
          export LD_LIBRARY_PATH="$PWD/pawncc/lib:$LD_LIBRARY_PATH"
          mkdir -p build
          cd gamemodes
          ../pawncc/bin/pawncc lonexs.pwn \
            -o../build/lonexs.amx \
            -i../include \
            '-;+' '-(+' -d3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lonexs-amx
          path: build/lonexs.amx
