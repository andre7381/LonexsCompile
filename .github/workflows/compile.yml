name: Build gamemode

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PAWNC_VERSION: "3.10.10"
  GAMEMODE: icerussia

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pawncc для Linux 32-битный
      - name: Install 32-bit libs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 libstdc++6:i386

      - name: Download Pawn compiler
        run: |
          curl -fsSL -o pawnc.tar.gz \
            "https://github.com/pawn-lang/compiler/releases/download/v${PAWNC_VERSION}/pawnc-${PAWNC_VERSION}-linux.tar.gz"
          mkdir -p pawnc
          tar -xzf pawnc.tar.gz -C pawnc --strip-components=1

      # В репозитории нет a_samp.inc и других стандартных инклудов
      - name: Download SA-MP stdlib
        run: git clone --depth 1 https://github.com/pawn-lang/samp-stdlib.git samp-stdlib

      - name: Compile
        run: |
          mkdir -p build
          export LD_LIBRARY_PATH="$PWD/pawnc/lib:$LD_LIBRARY_PATH"
          ./pawnc/bin/pawncc "gamemodes/${GAMEMODE}.pwn" \
            -ogamemodes/${GAMEMODE}.amx \
            -i"include" \
            -i"samp-stdlib" \
            -i"pawnc/include" \
            -d3 -;+ -(+ \
            | tee build/compile.log
          test -f "gamemodes/${GAMEMODE}.amx"

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAMEMODE }}-amx
          path: gamemodes/${{ env.GAMEMODE }}.amx

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: build/compile.log
          
