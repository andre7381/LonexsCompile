name: Compile Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pawn compiler
        id: pawncc
        uses: knryuu/pawn-compiler-action@v1

      - name: Compile lonexs.pwn
        run: |
          ${{ steps.pawncc.outputs.pawncc }} \
            gamemodes/lonexs.pwn \
            -iinclude \
            -ogamemodes/lonexs.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: lonexs-amx
          path: gamemodes/lonexs.amx
