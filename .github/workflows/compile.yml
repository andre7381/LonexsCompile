name: Compile Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib cmake make git

      - name: Build Pawn Compiler 3.10.10
        shell: bash
        run: |
          git clone --depth 1 --branch v3.10.10 https://github.com/pawn-lang/compiler.git pawn-compiler
          cd pawn-compiler
          mkdir build
          cd build
          cmake ../source/compiler \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_BUILD_TYPE=Release
          make -j2

      - name: Check Pawn Compiler
        shell: bash
        run: |
          ./pawn-compiler/build/pawncc

      - name: Compile lonexs.pwn
        shell: bash
        run: |
          ulimit -s unlimited

          ./pawn-compiler/build/pawncc \
            gamemodes/lonexs.pwn \
            -iinclude \
            -O1 \
            -Z \
            -d2 \
            -ogamemodes/lonexs.amx

      - name: Check AMX
        shell: bash
        run: |
          echo "=== AMX file ==="
          ls -lh gamemodes/lonexs.amx
          file gamemodes/lonexs.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: lonexs-amx
          path: gamemodes/lonexs.amx
