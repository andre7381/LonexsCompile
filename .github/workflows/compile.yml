name: Compile Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pawn compiler
        run: |
          git clone --depth 1 https://github.com/pawn-lang/compiler.git pawn-compiler
          cd pawn-compiler
          make

      - name: Compile lonexs.pwn
        shell: bash
        run: |
          ./pawn-compiler/pawncc \
            gamemodes/lonexs.pwn \
            -iinclude \
            -O1 \
            -d2 \
            -ogamemodes/lonexs.amx

      - name: Check AMX
        shell: bash
        run: |
          echo "=== AMX file ==="
          ls -lh gamemodes/lonexs.amx
          file gamemodes/lonexs.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: lonexs-amx
          path: gamemodes/lonexs.amx
