name: Compile Pawn

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pawn compiler
        id: pawncc
        uses: knryuu/pawn-compiler-action@v1

      - name: Show compiler version
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/pawncc/lib:$LD_LIBRARY_PATH"
          "$GITHUB_WORKSPACE/pawncc/bin/pawncc" -v

      - name: Compile lonexs.pwn
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/pawncc/lib:$LD_LIBRARY_PATH"

          "$GITHUB_WORKSPACE/pawncc/bin/pawncc" \
            gamemodes/lonexs.pwn \
            -iinclude \
            -O0 \
            -Z \
            -ogamemodes/lonexs.amx

      - name: Check AMX
        shell: bash
        run: |
          echo "=== AMX files ==="
          ls -lh gamemodes/lonexs.amx
          file gamemodes/lonexs.amx

      - name: Upload AMX
        uses: actions/upload-artifact@v4
        with:
          name: lonexs-amx
          path: gamemodes/lonexs.amx
          
